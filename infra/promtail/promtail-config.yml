server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: microservices-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: microservices
          __path__: /var/log/rikkei/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            traceId: traceId
            spanId: spanId
            userId: userId
            role: role
            path: path
            status: status
            durationMs: durationMs
            message: message
      - labels:
          level:
          service:
          traceId:
          userId:
          role:
          path:
          status:
