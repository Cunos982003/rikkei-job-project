  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
  #   ports:
  #     - "9002:9000"
  #     - "9001:9001"
  #   volumes:
  #     - miniodata:/data
  #   restart: unless-stopped

volumes:
  pgdata:
  job-uploads:
  recruitment-uploads:
