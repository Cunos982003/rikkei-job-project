name: Docker Build

on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-backend-images:
    name: Build Backend Service Images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend service images
        env:
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          found=0
          for dir in backend/*/; do
            service="$(basename "$dir")"
            if [ -f "${dir}Dockerfile" ]; then
              found=1
              echo "Building $service..."
              image="${REGISTRY}/${repo}-${service}"
              action="--load"
              [ "$PUSH" = "true" ] && action="--push"
              docker buildx build $action \
                --tag "${image}:${{ github.sha }}" \
                --tag "${image}:latest" \
                --file "${dir}Dockerfile" \
                "$dir"
            else
              echo "No Dockerfile for $service, skipping..."
            fi
          done
          [ "$found" = "0" ] && echo "No backend Dockerfiles found."
          exit 0

  build-frontend-image:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile
        id: check
        run: |
          if [ -f frontend/Dockerfile ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No frontend Dockerfile, skipping."; fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        if: steps.check.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ github.sha }}
