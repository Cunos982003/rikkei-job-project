name: Docker Build

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/docker-compose.yml'
      - 'infra/**/Dockerfile*'
  pull_request:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/docker-compose.yml'
      - 'infra/**/Dockerfile*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-backend-images:
    name: Build Backend Service Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ hashFiles('infra/**/Dockerfile*') != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend services
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend service images
        run: |
          cd backend
          for dir in */; do
            service_name="${dir%/}"
            dockerfile_path="${dir}Dockerfile"

            if [ -f "$dockerfile_path" ]; then
              echo "Building $service_name..."
              docker buildx build \
                --push \
                --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${service_name}:${{ steps.meta-backend.outputs.tags }}" \
                --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${service_name}:${{ github.sha }}" \
                --cache-from type=gha \
                --cache-to type=gha,mode=max \
                --file "$dockerfile_path" \
                "."
            else
              echo "No Dockerfile found for $service_name, skipping..."
            fi
          done

  build-frontend-image:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ hashFiles('frontend/Dockerfile*') != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        if: ${{ hashFiles('frontend/Dockerfile*') != '' }}
        run: |
          docker buildx build \
            --push \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.meta-frontend.outputs.tags }}" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --file frontend/Dockerfile \
            frontend/