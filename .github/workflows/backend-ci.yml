name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'infra/**'
      - 'backend/**'
  pull_request:
    branches: [dev]
    paths:
      - 'infra/**'
      - 'backend/**'

jobs:
  integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run backend tests against service containers
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: localhost
        run: |
          cd backend
          for dir in */; do
            if [ -f "${dir}build.gradle" ]; then
              echo "Testing ${dir%/}..."
              (cd "$dir" && chmod +x gradlew && ./gradlew test --no-daemon)
            fi
          done
