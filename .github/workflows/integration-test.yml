name: Integration Tests

on:
  push:
    branches: [dev]
    paths:
      - 'infra/**'
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [dev]
    paths:
      - 'infra/**'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  integration-test:
    name: Run Integration Tests with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ hashFiles('infra/docker-compose.yml') != '' && hashFiles('infra/docker-compose.yml') != '0' }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports: 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      kafka:
        image: apache/kafka:3.8
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        ports: 9092:9092
        options: >-
          --health-cmd="kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: minio/minio
        ports: 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      clamav:
        image: clamav/clamav
        ports: 3310:3310
        options: >-
          --health-cmd="clamdscan --version"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=10

      mailpit:
        image: axllent/mailpit
        ports: 1025:1025

      wiremock:
        image: wiremock/wiremock:3.8
        ports: 8089:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build all backend services
        run: |
          cd backend
          for dir in */; do
            if [ -f "${dir}build.gradle" ] || [ -f "${dir}build.gradle.kts" ]; then
              echo "Building ${dir%/}..."
              (cd "$dir" && ./gradlew build --no-daemon -x test)
            fi
          done

      - name: Run integration tests for all backend services
        run: |
          cd backend
          for dir in */; do
            if [ -f "${dir}build.gradle" ] || [ -f "${dir}build.gradle.kts" ]; then
              echo "Running integration tests for ${dir%/}..."
              (cd "$dir" && ./gradlew integrationTest --no-daemon) || true
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run Playwright E2E tests
        run: |
          cd frontend
          npx playwright install --with-deps
          npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:8080/api/v1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7