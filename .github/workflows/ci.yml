name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  frontend:
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  docker:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit

  # Summary job to report overall status
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "❌ Backend CI failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ Frontend CI failed"
            exit 1
          fi
          if [[ "${{ needs.docker.result }}" != "success" && "${{ needs.docker.result }}" != "skipped" ]]; then
            echo "❌ Docker build failed"
            exit 1
          fi
          echo "✅ All CI checks passed"