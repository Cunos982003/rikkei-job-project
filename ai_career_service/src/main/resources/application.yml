spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: ai_career_service
  datasource:
    url: ${AI_DATABASE_URL:jdbc:postgresql://localhost:5432/ai_db}
    username: ${AI_DATABASE_USERNAME:postgres}
    password: ${AI_DATABASE_PASSWORD:123}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    validate-on-migrate: false
  profiles:
    active: dev

app:
  integrations:
    profile-service-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
    job-service-url: ${JOB_SERVICE_URL:http://localhost:8085}
  ai:
    provider: ${AI_PROVIDER:mock}
    daily-limit: ${AI_CHAT_DAILY_LIMIT:30}
    timezone: ${AI_QUOTA_TIMEZONE:Asia/Ho_Chi_Minh}
    openai:
      api-key: ${AI_OPENAI_API_KEY:}
      endpoint: ${AI_OPENAI_ENDPOINT:https://api.openai.com/v1/chat/completions}
      model: ${AI_OPENAI_MODEL:gpt-4o-mini}
    gemini:
      api-key: ${AI_GEMINI_API_KEY:}
      endpoint: ${AI_GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
    claude:
      api-key: ${AI_CLAUDE_API_KEY:}
      endpoint: ${AI_CLAUDE_ENDPOINT:https://api.anthropic.com/v1/messages}
      model: ${AI_CLAUDE_MODEL:claude-3-5-haiku-latest}

server:
  port: 8090

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  info:
    env:
      enabled: false

  health:
    db:
      enabled: true