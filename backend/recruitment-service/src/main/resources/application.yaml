spring:
  config:
    import: optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: recruitment-service
  datasource:
    url: ${RECRUITMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/recruitment_db}
    username: ${RECRUITMENT_DATABASE_USERNAME:postgres}
    password: ${RECRUITMENT_DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 3
    validate-on-migrate: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8086}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  integrations:
    job-service-url: ${JOB_SERVICE_URL:http://localhost:8085}
    job-details-path: ${JOB_DETAILS_PATH:/jobs/{jobId}}
    profile-service-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
    cv-pdf-path: ${CV_PDF_PATH:/api/v1/cvs/{cvId}/pdf}
    ai-career-service-url: ${AI_CAREER_SERVICE_URL:http://localhost:8090}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
    meet-service-url: ${MEET_SERVICE_URL:http://localhost:9000}
    meet-service-key: ${LMS_SERVICE_KEY:}
  interview:
    reminder-cron: ${INTERVIEW_REMINDER_CRON:0 */15 * * * *}
  cv:
    snapshot-directory: ${CV_SNAPSHOT_DIRECTORY:uploads/recruitments}
    max-pdf-bytes: ${CV_MAX_PDF_BYTES:10485760}
  public-base-url: ${PUBLIC_BASE_URL:}

  # --- BẮT ĐẦU PHẦN THÊM MỚI CHO TT-04 ---
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  pm:
    service-key: ${PM_SERVICE_KEY:pm-service-key}
  # --- KẾT THÚC PHẦN THÊM MỚI CHO TT-04 ---

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    info:
      env:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${SPRING_PROFILES_ACTIVE:${spring.profiles.active:default}}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}}
---
spring:
  config:
    activate:
      on-profile: prod
management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
