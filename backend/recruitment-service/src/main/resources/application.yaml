spring:
  config:
    import: optional:file:../../.env[.properties],optional:file:.env[.properties]
  application:
    name: recruitment-service
  datasource:
    url: ${RECRUITMENT_DATABASE_URL}
    username: ${RECRUITMENT_DATABASE_USERNAME}
    password: ${RECRUITMENT_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8086}

app:
  jwt:
    secret: ${JWT_SECRET}
  integrations:
    job-service-url: ${JOB_SERVICE_URL:http://localhost:8085}
    job-details-path: ${JOB_DETAILS_PATH:/jobs/{jobId}}
    profile-service-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
    cv-pdf-path: ${CV_PDF_PATH:/api/v1/cvs/{cvId}/pdf}
  cv:
    snapshot-directory: ${CV_SNAPSHOT_DIRECTORY:uploads/recruitments}
    max-pdf-bytes: ${CV_MAX_PDF_BYTES:10485760}
  public-base-url: ${PUBLIC_BASE_URL:}
