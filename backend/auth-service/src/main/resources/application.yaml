server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  lms:
    base-url: ${LMS_BASE_URL:http://localhost:9000}
    service-key: ${LMS_SERVICE_KEY:dev-key}
    verify-endpoint: ${LMS_VERIFY_ENDPOINT:/lms/sso/verify}
    timeout-seconds: ${LMS_TIMEOUT_SECONDS:5}
    max-retries: ${LMS_MAX_RETRIES:2}
  mail:
    from: ${MAIL_FROM:no-reply@rikkei-jobs.vn}
    reset-url: ${RESET_PASSWORD_URL:http://localhost:5173/reset-password}
