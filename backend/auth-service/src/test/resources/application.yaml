server:
  port: 0

spring:
  application:
    name: auth-service-test
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:auth-service-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-seconds: 3600
  lms:
    base-url: http://localhost:9000
    service-key: test-service-key
    verify-endpoint: /lms/sso/verify
    timeout-seconds: 2
    max-retries: 2
  mail:
    from: no-reply@rikkei-jobs.vn
    reset-url: http://localhost:5173/reset-password
