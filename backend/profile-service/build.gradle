plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'profile-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Flyway is managed by Spring Boot dependency management
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // MinIO/S3 client for object storage
    implementation 'io.minio:minio:8.5.14'

    // JWT dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:postgresql:1.20.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Exclude integration tests that require Testcontainers/Docker
    exclude '**/integration/**'
    exclude '**/*IntegrationTest*.class'
    exclude '**/SchemaMigrationTest*.class'
    exclude '**/SchemaUpgradeTest*.class'
    // Exclude repository tests that need database
    exclude '**/*RepositoryTest*.class'
    // Exclude controller tests that need full context
    exclude '**/*ControllerTest*.class'
    // Exclude service tests that need database
    exclude '**/SkillRecomputeServiceTest*.class'
    exclude '**/PublicProfileQueryTest*.class'
    exclude '**/SkillProfileServiceTest*.class'
    // Exclude file tests that need storage
    exclude '**/File*Test*.class'
    exclude '**/MagicBytesValidatorTest*.class'
}

task integrationTest(type: Test) {
    useJUnitPlatform()
    include '**/integration/**'
    include '**/*IntegrationTest*.class'
    include '**/SchemaMigrationTest*.class'
    include '**/SchemaUpgradeTest*.class'
    include '**/*RepositoryTest*.class'
    include '**/*ControllerTest*.class'
    include '**/SkillRecomputeServiceTest*.class'
    include '**/PublicProfileQueryTest*.class'
    include '**/SkillProfileServiceTest*.class'
    include '**/File*Test*.class'
    include '**/MagicBytesValidatorTest*.class'
    // Only run if Docker is available (can be controlled via env var)
    onlyIf { System.getenv('RUN_INTEGRATION_TESTS') != null }
}

tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
}