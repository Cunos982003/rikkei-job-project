server:
  port: ${SERVER_PORT:8085}

spring:
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: job-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:false}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
  upload:
    dir: "uploads/logos"

auth:
  base-url: ${AUTH_BASE_URL:http://localhost:8081}
  client:
    stub: ${AUTH_CLIENT_STUB:false}

skill:
  catalog:
    base-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
    stub: ${SKILL_CATALOG_STUB:false}

candidate:
  skills:
    base-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
    stub: ${CANDIDATE_SKILLS_STUB:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  info:
    env:
      enabled: false

  health:
    db:
      enabled: true
---
# Local development profile (H2 in-memory)
spring:
  config:
    activate:
      on-profile: local | local-h2

  datasource:
    url: jdbc:h2:mem:job_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

auth:
  client:
    stub: ${AUTH_CLIENT_STUB:false}

skill:
  catalog:
    stub: ${SKILL_CATALOG_STUB:true}

candidate:
  skills:
    stub: ${CANDIDATE_SKILLS_STUB:true}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,loggers,httptrace