server:
  port: 0

spring:
  application:
    name: job-service-test
  datasource:
    url: jdbc:h2:mem:job_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000
  upload:
    dir: "build/test-uploads/logos"

