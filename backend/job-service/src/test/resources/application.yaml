server:
  port: 0

spring:
  application:
    name: job-service-test
  datasource:
    url: jdbc:h2:mem:job_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:test-only-jwt-secret-not-for-production}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  upload:
    dir: "build/test-uploads/logos"
