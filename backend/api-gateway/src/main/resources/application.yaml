server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-scoped
              uri: ${GATEWAY_AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/services/auth/**
              filters: &scoped-filters
                - StripPrefix=3
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: profile-scoped
              uri: ${GATEWAY_PROFILE_URL:http://localhost:8082}
              predicates:
                - Path=/api/services/profile/**
              filters: *scoped-filters
            - id: evidence-scoped
              uri: ${GATEWAY_EVIDENCE_URL:http://localhost:8083}
              predicates:
                - Path=/api/services/evidence/**
              filters: *scoped-filters
            - id: assessment-scoped
              uri: ${GATEWAY_ASSESSMENT_URL:http://localhost:8084}
              predicates:
                - Path=/api/services/assessment/**
              filters: *scoped-filters
            - id: job-scoped
              uri: ${GATEWAY_JOB_URL:http://localhost:8085}
              predicates:
                - Path=/api/services/job/**
              filters: *scoped-filters
            - id: recruitment-scoped
              uri: ${GATEWAY_RECRUITMENT_URL:http://localhost:8086}
              predicates:
                - Path=/api/services/recruitment/**
              filters: *scoped-filters
            - id: notification-scoped
              uri: ${GATEWAY_NOTIFICATION_URL:http://localhost:8087}
              predicates:
                - Path=/api/services/notification/**
              filters: *scoped-filters
            - id: audit-scoped
              uri: ${GATEWAY_AUDIT_URL:http://localhost:8088}
              predicates:
                - Path=/api/services/audit/**
              filters: *scoped-filters
            - id: learning-scoped
              uri: ${GATEWAY_LEARNING_URL:http://localhost:8089}
              predicates:
                - Path=/api/services/learning/**
              filters: *scoped-filters
            - id: ai-scoped
              uri: ${GATEWAY_AI_URL:http://localhost:8090}
              predicates:
                - Path=/api/services/ai/**
              filters: *scoped-filters
            - id: auth
              uri: ${GATEWAY_AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/auth/**
              filters: &cors-response-filters
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: ai-conversations-direct
              uri: ${GATEWAY_AI_URL:http://localhost:8090}
              predicates:
                - Path=/me/conversations,/me/conversations/**
              filters: *cors-response-filters
            - id: profile
              uri: ${GATEWAY_PROFILE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/profiles/**,/api/v1/files/**,/api/v1/candidates,/api/v1/candidates/**,/api/v1/candidate-directory/**,/api/v1/staff/profile-reviews,/api/v1/staff/profiles/**,/api/v1/staff/contact-requests,/api/v1/staff/contact-requests/**,/api/v1/staff/contact-access-logs,/api/v1/me/contact-access-logs,/me/**
              filters: *cors-response-filters
            - id: recruitment
              uri: ${GATEWAY_RECRUITMENT_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/jobs/*/recruit,/api/v1/me/recruitments,/api/v1/me/recruitments/**,/api/v1/recruitments/**,/api/v1/staff/recruitments/**,/api/v1/staff/applications/**,/api/v1/applications,/api/v1/applications/**,/api/v1/rounds/**,/api/v1/me/interviews,/api/v1/me/interviews/**,/api/v1/companies/me/interviews,/api/v1/hr/applications,/api/v1/hr/applications/**,/api/v1/me/offers,/api/v1/me/offers/**,/api/v1/me/employment-records
              filters: *cors-response-filters
            - id: profile-skills
              uri: ${GATEWAY_PROFILE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/skills,/api/v1/skills/**
              filters:
                - RewritePath=/api/v1/skills(?<segment>.*), /api/v1/skill-catalog${segment}
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: job
              uri: ${GATEWAY_JOB_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/companies/**,/api/v1/staff/companies/**,/api/v1/staff/hr-accounts/**,/api/v1/jobs,/api/v1/jobs/**,/companies/**,/staff/companies/**,/staff/hr-accounts/**,/jobs,/jobs/**,/api/v1/staff/jobs,/api/v1/staff/jobs/**,/staff/jobs,/staff/jobs/**
              filters: *cors-response-filters
            - id: recruitment-snapshot
              uri: ${GATEWAY_RECRUITMENT_URL:http://localhost:8086}
              predicates:
                - Path=/recruitments/*/cv-snapshot
              filters:
                - PrefixPath=/api/v1
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: job-jobs
              uri: ${GATEWAY_JOB_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/jobs/**,/jobs/**
              filters: *cors-response-filters
            - id: ai-career
              uri: ${GATEWAY_AI_URL:http://localhost:8090}
              predicates:
                - Path=/ai-career/**
              filters:
                - StripPrefix=1
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
                - RemoveResponseHeader=Access-Control-Expose-Headers
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Max-Age
            - id: ai-career-direct
              uri: ${GATEWAY_AI_URL:http://localhost:8090}
              predicates:
                - Path=/me/job-recommendations,/me/job-recommendations/**
              filters: *cors-response-filters
            - id: ai-interview-practice
              uri: ${GATEWAY_AI_URL:http://localhost:8090}
              predicates:
                - Path=/me/interview-practices,/me/interview-practices/**
              filters: *cors-response-filters
            - id: learning
              uri: ${GATEWAY_LEARNING_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/learning/**,/api/v1/staff/upskilling,/api/v1/staff/upskilling/**,/staff/upskilling,/staff/upskilling/**,/api/v1/me/target,/api/v1/me/gap-analysis,/api/v1/me/course-suggestions,/api/v1/me/enrollments/**,/api/v1/me/learning-path,/api/v1/me/learning-path/**,/me/target,/me/gap-analysis,/me/course-suggestions,/me/enrollments/**,/me/learning-path,/me/learning-path/**
              filters: *cors-response-filters

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  gateway:
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173}
    rate-limit-per-minute: ${GATEWAY_RATE_LIMIT_PER_MINUTE:60}
    rate-limit-fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

    info:
      env:
        enabled: false

  health:
    db:
      enabled: true